<!-- Contact Section -->
<section id="contact" style="background-color: #f4f4f4; padding: 4rem 2rem; text-align: center; font-family: 'Roboto', sans-serif;">
    <h2 style="font-size: 2.5rem; color: #880e4f; margin-bottom: 1.5rem;">Contact Us</h2>
    <p style="font-size: 1.2rem; color: #555; margin-bottom: 2rem;">If you have any questions, feedback, or need assistance, feel free to reach out to us!</p>
    <!-- Contact Form -->
    <div class="contact-form-container" style="max-width: 600px; margin: 0 auto; background-color: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1); transition: transform 0.3s ease, box-shadow 0.3s ease;">
      <form id="contactForm">
        <label for="name" style="font-weight: 600; color: #333; font-size: 1.1rem;">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; transition: border 0.3s ease;" onfocus="this.style.borderColor='#e91e63';" onblur="this.style.borderColor='#ccc';" />
  
        <label for="email" style="font-weight: 600; color: #333; font-size: 1.1rem; margin-top: 1rem;">Your Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; transition: border 0.3s ease;" onfocus="this.style.borderColor='#e91e63';" onblur="this.style.borderColor='#ccc';" />
  
        <label for="message" style="font-weight: 600; color: #333; font-size: 1.1rem; margin-top: 1rem;">Your Message:</label>
        <textarea id="message" name="message" placeholder="Type your message here" required style="width: 100%; padding: 0.75rem; margin-top: 0.5rem; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; height: 150px; transition: border 0.3s ease;" onfocus="this.style.borderColor='#e91e63';" onblur="this.style.borderColor='#ccc';"></textarea>
  
        <button type="submit" style="margin-top: 1.5rem; background-color: #e91e63; color: white; padding: 1rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background-color 0.3s ease, transform 0.3s ease; width: 100%;">Send Message</button>
      </form>
    </div>
  
    <!-- Hover effect for form container -->
    <script>
      const formContainer = document.querySelector('.contact-form-container');
      formContainer.addEventListener('mouseover', () => {
        formContainer.style.transform = 'scale(1.03)';
        formContainer.style.boxShadow = '0 8px 20px rgba(0, 0, 0, 0.15)';
      });
      formContainer.addEventListener('mouseout', () => {
        formContainer.style.transform = 'scale(1)';
        formContainer.style.boxShadow = '0 6px 15px rgba(0, 0, 0, 0.1)';
      });
    </script>
  
    <!-- Contact Info -->
    <div class="contact-info" style="margin-top: 2rem; color: #333; font-size: 1.1rem;">
      <p>Or reach us directly at:</p>
      <p>Email: <a href="mailto:contact@stylesphere.com" style="color: #e91e63; font-weight: 600; transition: color 0.3s ease;" onmouseover="this.style.color='#880e4f';" onmouseout="this.style.color='#e91e63';">contact@stylesphere.com</a></p>
      <p>Phone: <a href="phno:+91-8129636015" style="color: #e91e63; font-weight: 600; transition: color 0.3s ease;" onmouseover="this.style.color='#880e4f';" onmouseout="this.style.color='#e91e63';">+1 234 567 890</a></p>
    </div>
  </section>
